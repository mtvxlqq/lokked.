# Релиз по тегу: собирает установщики и прикладывает их к релизу.
#
# Windows собирается здесь, потому что собрать `.msi` можно только на
# Windows; Linux — потому что раз уж тег есть, `.rpm` к нему тоже нужен.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Сборка · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Одна упавшая платформа не должна отменять другую: половина релиза
      # лучше, чем ничего, и вторую можно доложить руками.
      fail-fast: false
      matrix:
        include:
          # AppImage не собирается намеренно: его шаг тянет `linuxdeploy` из
          # сети и спотыкается о современные библиотеки — тот же обход, что и
          # в `npm run package:linux`.
          - os: ubuntu-latest
            bundles: rpm,deb
            artifacts: src-tauri/target/release/bundle/rpm/*.rpm src-tauri/target/release/bundle/deb/*.deb
          - os: windows-latest
            bundles: msi,nsis
            artifacts: src-tauri/target/release/bundle/msi/*.msi src-tauri/target/release/bundle/nsis/*.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Системные библиотеки
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - name: Сборка
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      - name: Приложить к релизу
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" ${{ matrix.artifacts }} --clobber
          # Удаление тега превращает релиз в черновик, а черновик не виден
          # никому, кроме владельца: публикуем на всякий случай ещё раз.
          gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
